stages:
  - toolchain
  - verify

.docker-amd64:
  image: docker:29.4.0-cli@sha256:bb21349a52c00b206ad8b5c03fa52023c741c4cf11f269d40d40b9ebaac73d96
  services:
    - name: docker:29.4.0-dind@sha256:4d2c6e334de4b26d492c0a8cc5438e3dbf1a02eee899fc0d4d39b96202c943a7
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"

toolchain-build:
  extends: .docker-amd64
  stage: toolchain
  script:
    - mkdir -p test-results
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - bash scripts/build_toolchain_image.sh --push "$CI_REGISTRY_IMAGE/toolchain:$CI_COMMIT_SHA" --env-file test-results/toolchain.env
  artifacts:
    reports:
      dotenv: test-results/toolchain.env
    paths:
      - test-results/toolchain.env

toolchain-verify:
  extends: .docker-amd64
  stage: verify
  needs:
    - job: toolchain-build
      artifacts: true
  script:
    - test -n "$TOOLCHAIN_IMAGE"
    - 'case "$TOOLCHAIN_IMAGE" in *@sha256:*) ;; *) printf "%s\n" "invalid TOOLCHAIN_IMAGE" >&2; exit 1 ;; esac'
    - docker pull "$TOOLCHAIN_IMAGE"
    - docker run --rm --platform linux/amd64 -e CI=true -e CI_COMMIT_SHA="$CI_COMMIT_SHA" -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$TOOLCHAIN_IMAGE" bash scripts/run_toolchain_baseline.sh
  artifacts:
    when: always
    paths:
      - test-results/eino-workbench-playwright-report/
      - test-results/toolchain-baseline.log
