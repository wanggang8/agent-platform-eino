server:
  addr: "127.0.0.1:8081"
  read_timeout: "10s"
  write_timeout: "30s"

database:
  driver: "sqlite"
  dsn: "data/eino-workbench.db"

llm:
  provider: "mock"
  base_url: "http://127.0.0.1/mock-llm"
  model: "mock-chat"
  # api_key 可写在 ignored 的 local 配置中；mock provider 不需要。
  timeout: "30s"

security:
  redact_secrets: true
  allow_private_network: false

observability:
  log_level: "info"
  enable_request_log: true

budgets:
  default_timeout: "60s"
  max_tool_timeout: "120s"

# Phase 3 默认不注册业务能力；smoke 或后续 provider 通过配置/注册表显式声明。
capabilities: []
