server:
  addr: "127.0.0.1:8081"
  read_timeout: "10s"
  write_timeout: "30s"

database:
  driver: "sqlite"
  dsn: "data/eino-workbench.db"

llm:
  provider: "mock"
  base_url: "http://127.0.0.1/mock-llm"
  model: "mock-chat"
  # api_key 可写在 ignored 的 local 配置中；mock provider 不需要。
  timeout: "30s"

security:
  redact_secrets: true
  allow_private_network: false

observability:
  log_level: "info"
  enable_request_log: true
  cost_statistics:
    # 默认 0 表示只统计 token，不估算成本；真实单价写入 ignored local 配置。
    input_unit_microunits: 0
    output_unit_microunits: 0

budgets:
  default_timeout: "60s"
  max_tool_timeout: "120s"
  max_model_calls_per_run: 8
  max_tool_calls_per_run: 24
  max_input_tokens_per_run: 32000

# Phase 3 默认不注册业务能力；smoke 或后续 provider 通过配置/注册表显式声明。
capabilities: []

# Phase 5/8 Fobrain provider 示例。真实 api_token 只能写入 ignored local 配置。
fobrain:
  enabled: false
  connector_id: "fobrain"
  workspace_id: "default"
  base_url: "https://fobrain.example.local"
  timeout: "10s"
  credential:
    status: "missing"
    display_ref: "missing"
    owner_scope: "workspace"
    auth_param: "authorization"
  connector_status:
    mode: "mock"
    available: false
  tls:
    insecure_skip_verify: false
